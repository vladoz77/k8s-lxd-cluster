# tasks/cluster-init.yaml
- name: Determine kube-proxy skip
  ansible.builtin.set_fact:
    skip_kubeproxy: >-
       {{ cni_plugin == 'cilium'
          or (cni_plugin == 'calico' and calico_ebpf_enabled | bool) }}

- name: Copy template kubeadm
  ansible.builtin.template:
    src: "kubeadm-config.j2"
    dest: "/tmp/kubeadm-config.yaml"

- name: Kubeadm init
  ansible.builtin.shell: kubeadm init --config /tmp/kubeadm-config.yaml 2>&1 | tee /tmp/kubeadm-init.log
  args:
    executable: /bin/bash
  register: kubeadm_init_result
  changed_when: false
  failed_when: false

- name: Save kubeadm init logs to localhost
  ansible.builtin.fetch:
    src: /tmp/kubeadm-init.log
    dest: "{{ local_kubeconfig_dir }}/kubeadm-init-{{ inventory_hostname }}.log"
    flat: yes

- name: Fail if kubeadm init actually failed
  ansible.builtin.fail:
    msg: "kubeadm init failed, see saved log for details"
  when: kubeadm_init_result.rc != 0

- name: Create `.kube` directory
  ansible.builtin.file:
    path: "{{ home_kube_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"

- name: Create link to configuration
  ansible.builtin.file:
    src: "{{ base_kube_conf_dir }}"
    dest: "{{ home_kube_dir }}/config"
    state: link
    owner: "{{ username }}"

- name: Read kubeconfig content
  ansible.builtin.slurp:
    src: "{{ base_kube_conf_dir }}"
  register: kubeconfig_content
  failed_when: kubeconfig_content.content is not defined

- name: Create local `.kube` directory on host
  ansible.builtin.file:
    path: "{{ local_kubeconfig_dir }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Create local kubeconfig on host
  ansible.builtin.copy:
    content: "{{ kubeconfig_content.content | b64decode }}"
    dest: "{{ local_kubeconfig_dir }}/config"
  delegate_to: localhost
  become: false
  when: kubeconfig_content.content is defined