# tasks/cilium.yaml
- name: Install helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "{{ helm_install_path | dirname }}"
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, '*/helm']
    creates: "{{ helm_install_path }}"
  environment:
    http_proxy: "{{ proxy_url | default(omit) }}"
    https_proxy: "{{ proxy_url | default(omit) }}"

- name: Install Gateway API CRDs
  kubernetes.core.k8s:
    src: "{{ gateway_api_crds }}"
    state: present
    kubeconfig: "{{ base_kube_conf_dir }}"
  when: cilium_gateway_api_enabled | bool

- name: Render cilium values
  ansible.builtin.template:
    src: cilium.yaml.j2
    dest: /tmp/cilium-values.yaml
    mode: '0600'

- name: Install cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium
    chart_repo_url: https://helm.cilium.io
    chart_version: "{{ cilium_version }}"
    release_namespace: "{{ cilium_namespace }}"
    create_namespace: true
    values_files: [/tmp/cilium-values.yaml]
    kubeconfig: "{{ base_kube_conf_dir }}"
    wait: true
    wait_timeout: 10m
    binary_path: "{{ helm_install_path }}"

- name: Wait for Cilium L2/LB CRDs
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: "{{ item }}"
    kubeconfig: "{{ base_kube_conf_dir }}"
  register: cilium_crd
  until: cilium_crd.resources | length > 0
  retries: 20
  delay: 5
  loop:
    - ciliumloadbalancerippools.cilium.io
    - ciliuml2announcementpolicies.cilium.io
  when: cilium_l2_enabled | bool

- name: Apply LB IP pool and L2 policy
  kubernetes.core.k8s:
    template: cilium-l2.yaml.j2
    state: present
    kubeconfig: "{{ base_kube_conf_dir }}"
  when: cilium_l2_enabled | bool