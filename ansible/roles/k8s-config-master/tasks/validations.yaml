# tasks/validations.yaml
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - interface_name is defined
      - username is defined
      - kubernetesVersion is defined
      - kubernetesSubversion is defined
      - cni_plugin is defined
      - ha_enabled is defined
      - k8s_first_master is defined
      - k8s_first_master in groups['master']
    fail_msg: >-
      Не заданы обязательные переменные: interface_name, username,
      kubernetesVersion, kubernetesSubversion, cni_plugin, ha_enabled.
      Проверь inventories/<env>/group_vars/all.yaml.
    quiet: true

- name: Validate CNI plugin
  ansible.builtin.assert:
    that: cni_plugin in ['calico', 'cilium', 'none']
    fail_msg: "cni_plugin должен быть calico, cilium или none, сейчас: {{ cni_plugin }}"
    quiet: true

- name: Validate HA variables
  ansible.builtin.assert:
    that:
      - vip_address is defined
      - vip_address is match('^\d{1,3}(\.\d{1,3}){3}$')
      - vip_port is defined
      - vip_port | int > 0
    fail_msg: "При ha_enabled=true нужны корректные vip_address и vip_port"
    quiet: true
  when: ha_enabled | bool

- name: Validate network facts
  ansible.builtin.assert:
    that:
      - ansible_facts[interface_name] is defined
      - ansible_facts[interface_name].ipv4 is defined
    fail_msg: "На {{ inventory_hostname }} нет интерфейса {{ interface_name }} или у него нет IPv4"
    quiet: true

- name: Validate API endpoint
  ansible.builtin.assert:
    that:
      - api_endpoint_host | trim | length > 0
      - api_endpoint_port | int > 0
    quiet: true

- name: Validate subnets
  ansible.builtin.assert:
    that:
      - podSubnet is defined and '/' in podSubnet
      - serviceSubnet is defined and '/' in serviceSubnet
      - podSubnet != serviceSubnet
    fail_msg: "podSubnet и serviceSubnet должны быть в CIDR-формате и не совпадать"
    quiet: true

- name: Validate Cilium variables
  ansible.builtin.assert:
    that:
      - cilium_lb_pool_start is defined
      - cilium_lb_pool_stop is defined
    fail_msg: "Для cilium с cilium_l2_enabled нужны cilium_lb_pool_start и cilium_lb_pool_stop"
    quiet: true
  when:
    - cni_plugin == 'cilium'
    - cilium_l2_enabled | bool

- name: Validate Calico variables
  ansible.builtin.assert:
    that:
      - calico_version is defined
      - calico_encapsulation_type in ['NONE', 'IPIP', 'VXLAN']
    fail_msg: "calico_encapsulation_type должен быть NONE, IPIP или VXLAN"
    quiet: true
  when: cni_plugin == 'calico'