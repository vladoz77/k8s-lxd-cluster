# tasks/join-worker.yaml
- name: Check API endpoint is reachable from worker
  ansible.builtin.uri:
    url: "https://{{ api_endpoint_host }}:{{ api_endpoint_port }}/readyz"
    validate_certs: false
    status_code: 200
  register: endpoint_api
  until: endpoint_api.status == 200
  retries: 12
  delay: 5

- name: Create join token
  ansible.builtin.command: kubeadm token create --ttl 15m
  register: join_token
  delegate_to: "{{ k8s_first_master }}"
  changed_when: true
  no_log: true

- name: Get discovery-token-ca-cert-hash
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
      openssl rsa -pubin -outform der 2>/dev/null |
      openssl dgst -sha256 -hex | sed 's/^.* //'
  register: ca_hash
  delegate_to: "{{ k8s_first_master }}"
  changed_when: false

- name: Join worker node
  block:
    - name: Render join config
      ansible.builtin.template:
        src: kubeadm-join-worker.yaml.j2
        dest: /root/kubeadm-join-worker.yaml
        mode: "0600"
      no_log: true

    - name: Run kubeadm join
      ansible.builtin.command: kubeadm join --config /root/kubeadm-join-worker.yaml
      changed_when: true
  always:
    - name: Remove join config with secrets
      ansible.builtin.file:
        path: /root/kubeadm-join-worker.yaml
        state: absent