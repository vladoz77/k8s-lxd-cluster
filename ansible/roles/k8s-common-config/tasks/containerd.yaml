- name: Download containerd binary archive
  ansible.builtin.get_url:
    url: "{{ containerd_url }}"
    dest: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    mode: '0644'
  environment:
    http_proxy: "{{ proxy_url | default(omit)}}"
    https_proxy: "{{ proxy_url | default(omit)}}"

- name: Extract containerd binaries to /usr/local
  ansible.builtin.unarchive:
    src: "/tmp/containerd-{{ containerd_version }}.tar.gz"
    dest: /usr/local
    remote_src: yes
    creates: /usr/local/bin/containerd

- name: Download containerd.service systemd unit
  ansible.builtin.get_url:
    url: "{{ containerd_service_url }}"
    dest: /etc/systemd/system/containerd.service
    mode: '0644'
  environment:
    http_proxy: "{{ proxy_url | default(omit)}}"
    https_proxy: "{{ proxy_url | default(omit)}}"

- name: Download and install runc
  ansible.builtin.get_url:
    url: "{{ runc_url }}"
    dest: /usr/local/bin/runc
    mode: '0755'
  environment:
    http_proxy: "{{ proxy_url | default(omit)}}"
    https_proxy: "{{ proxy_url | default(omit)}}"

- name: Create /etc/containerd directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: '0755'

- name: Create folder certs.d for custom registry
  ansible.builtin.file:
    path: /etc/containerd/certs.d
    state: directory
    mode: '0755'

- name: Enable dockerhub mirror on containerd
  ansible.builtin.file:
    path: /etc/containerd/certs.d/docker.io
    state: directory
    mode: u=rw,g=r,o=r
  when: dockerhubMirror | default(false)

- name: Enable dockerhub mirror on containerd [file hosts.toml]
  ansible.builtin.template:
    src: hosts.toml.j2
    dest: /etc/containerd/certs.d/docker.io/hosts.toml
    owner: root
    mode: u=rw,g=r,o=r
  when: dockerhubMirror | default(false)

- name: Deploy containerd config.toml
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
  notify: restart containerd

- name: Ensure containerd systemd drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/containerd.service.d
    state: directory
    mode: '0755'
  when: containerd_proxy_enabled | default(false)

- name: Configure containerd proxy environment
  ansible.builtin.template:
    src: containerd-http-proxy.conf.j2
    dest: /etc/systemd/system/containerd.service.d/http-proxy.conf
  when: containerd_proxy_enabled | default(false)
  notify: restart containerd

- name: Force containerd restart 
  meta: flush_handlers

- name: Download crictl
  ansible.builtin.get_url:
    url: "{{ crictl_url_download }}"
    dest: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    mode: '0644'
  environment:
    http_proxy: "{{ proxy_url | default(omit) }}"
    https_proxy: "{{ proxy_url | default(omit) }}"

- name: Extractl crictl binary
  ansible.builtin.unarchive:
    src: "/tmp/crictl-{{ crictl_version }}.tar.gz"
    dest: /usr/bin
    remote_src: true
    mode: '0755'
    creates: /usr/bin/crictl

- name: Config crictl
  ansible.builtin.blockinfile:
    dest: /etc/crictl.yaml
    create: true
    block: |
      runtime-endpoint: unix:///run/containerd/containerd.sock
      image-endpoint: unix:///run/containerd/containerd.sock
      timeout: 10
